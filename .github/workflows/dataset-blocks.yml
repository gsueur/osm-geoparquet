# 2020 Census blocks with their counts: parquetry:parquetry/census/tiger/2020/block/.
#
# The 2020 TIGER/Line tabulation blocks (TABBLOCK20, one zip per state) with
# POP20 and HOUSING20, one GeoParquet file per state, and the counts on H3
# cells with a map. scripts/datasets/blocks.py documents the layout and the
# gate (every state's POP20 equals its 2020 resident population).
#
# 2020 Census geography, fixed until 2030: the zips were last modified in
# January 2023. A monthly run compares the fingerprint of their
# Last-Modified with the published _source.json and stops when nothing moved.
#
#   build    fetch, gate, write and tile, upload nothing
#   publish  the same, then upload (a scheduled run publishes), then the
#            census Portolan catalog at /census/catalog/ (its tiger-2020-block/ part)
#   catalog  only the catalog, rendered from the files already published
#
# Its own workflow, as dataset-acs.yml: one source, its own cycle. All three
# render the same census catalog, from what is published.
#
# Needs the R2 secrets the nightly uses.

name: dataset-blocks

on:
  schedule:
    - cron: "17 9 3 * *"
  workflow_dispatch:
    inputs:
      stage:
        description: "build writes and verifies; publish also uploads; catalog only the catalog"
        type: choice
        options: [build, publish, catalog]
        default: build
      force:
        description: "Rebuild even if no source has moved"
        type: boolean
        default: false

# One catalog for all census workflows: never render it from two at once.
concurrency:
  group: dataset-census
  cancel-in-progress: false

env:
  REMOTE: parquetry:parquetry/census
  PUBLIC: https://parquetry.geomermaids.com/census
  BLOCKS: tiger/2020/block
  PUBLISH: ${{ github.event_name == 'schedule' || inputs.stage == 'publish' }}
  CATALOG_ONLY: ${{ inputs.stage == 'catalog' }}
  LC_ALL: C.UTF-8
  RCLONE_CONFIG_PARQUETRY_TYPE: s3
  RCLONE_CONFIG_PARQUETRY_PROVIDER: Cloudflare
  RCLONE_CONFIG_PARQUETRY_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  RCLONE_CONFIG_PARQUETRY_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  RCLONE_CONFIG_PARQUETRY_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  RCLONE_CONFIG_PARQUETRY_ACL: private
  RCLONE_CONFIG_PARQUETRY_NO_CHECK_BUCKET: "true"
  # Replaced in place only if the Census Bureau corrects a zip: a short cache.
  CACHE: "Cache-Control: public, max-age=3600"

jobs:
  blocks:
    runs-on: ubuntu-24.04
    # 10.3 GB of zips, one state at a time (each deleted once written), about
    # 6 GB of output. On a workstation at 4 threads the 52 states take about
    # 40 min; the runner downloads faster and has 4 cores.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --project scripts
      - name: Anything new upstream?
        id: check
        run: |
          if [ "$CATALOG_ONLY" = "true" ]; then
            echo "no build"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          uv run --project scripts python scripts/datasets/blocks.py upstream > upstream.json
          now=$(jq -r .fingerprint upstream.json)
          was=$(curl -fsS "$PUBLIC/$BLOCKS/_source.json" | jq -r .fingerprint || echo none)
          echo "upstream $now, published $was"
          if [ "$now" = "$was" ] && [ "${{ inputs.force }}" != "true" ] && [ "$PUBLISH" = "true" ]; then
            echo "nothing moved upstream"; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Work dir on the runner's big scratch disk
        if: steps.check.outputs.go == 'true'
        run: |
          sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work
          echo "WORK=/mnt/work" >> "$GITHUB_ENV"
          df -h /mnt; free -g
      - name: Fetch, gate, write and tile
        if: steps.check.outputs.go == 'true'
        run: |
          uv run --project scripts python scripts/datasets/pmtiles.py install --dest "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH" TMPDIR="$WORK/tmp"
          mkdir -p "$TMPDIR"
          /usr/bin/time -v uv run --project scripts python scripts/datasets/blocks.py build \
            --work-dir "$WORK" --out-dir "$WORK/out" --threads 4 2> >(tee "$WORK/time.txt" >&2)
          grep -E "Maximum resident|Elapsed" "$WORK/time.txt"
          du -sh "$WORK/out"; df -h /mnt
          jq '{complete, total_features, population, housing_units, gate, h3: .h3.cells,
               pmtiles: (.pmtiles | {bytes, tiles})}' "$WORK/out/$BLOCKS/_manifest.json"
      - name: rclone
        if: (steps.check.outputs.go == 'true' && env.PUBLISH == 'true') || env.CATALOG_ONLY == 'true'
        run: |
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
          rclone version | sed -n 1p
      # The data first, then the manifest and the files that name it: a
      # reader never finds a path that is not there yet. Only tiger/2020/block/:
      # census/'s own index.json and _source.json belong to dataset-census.
      - name: Publish
        if: steps.check.outputs.go == 'true' && env.PUBLISH == 'true'
        run: |
          out="$WORK/out/$BLOCKS"
          # Only the GeoParquet that changed, and the PMTiles made from them.
          scripts/upload_changed.sh "$out" "$REMOTE/$BLOCKS" "$PUBLIC/$BLOCKS" census-blocks "$BLOCKS"
          rclone copy "$out" "$REMOTE/$BLOCKS" --include "_manifest.json" \
            --include "ATTRIBUTION.txt" --include "_source.json" \
            --ignore-times --header-upload "Cache-Control: public, max-age=300"
          # The stamp last: the catalog step reads it.
          rclone copy "$out/_files" "$REMOTE/$BLOCKS/_files" --include "*.json" --ignore-times \
            --header-upload "Cache-Control: public, max-age=300"

      - name: Check what is live
        if: steps.check.outputs.go == 'true' && env.PUBLISH == 'true'
        run: |
          set +e
          fail=0
          for f in _manifest.json _source.json ATTRIBUTION.txt blocks_h3.parquet blocks_h3.pmtiles \
                   state=CA/blocks.parquet state=TX/blocks.parquet state=PR/blocks.parquet; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -I "$PUBLIC/$BLOCKS/$f")
            [ "$code" = "200" ] || { echo "BAD $f -> $code"; fail=1; continue; }
            echo "ok  $f"
          done
          n=$(curl -fsS "$PUBLIC/$BLOCKS/_manifest.json" | jq '.files | length')
          [ "$n" = "52" ] || { echo "BAD the manifest lists $n state files, want 52"; fail=1; }
          range=$(curl -s -o /dev/null -w '%{http_code}' -r 0-3 "$PUBLIC/$BLOCKS/state=CA/blocks.parquet")
          [ "$range" = "206" ] || { echo "BAD parquet range request -> $range"; fail=1; }
          range=$(curl -s -o /dev/null -w '%{http_code}' -r 0-126 "$PUBLIC/$BLOCKS/blocks_h3.pmtiles")
          [ "$range" = "206" ] || { echo "BAD pmtiles range request -> $range"; fail=1; }
          type=$(curl -sI "$PUBLIC/$BLOCKS/blocks_h3.pmtiles" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2}')
          [ "$type" = "application/vnd.pmtiles" ] || { echo "BAD pmtiles Content-Type: $type"; fail=1; }
          exit $fail
      # After the data, so the catalog never links a file that is not there.
      - name: STAC catalog, published
        if: (steps.check.outputs.go == 'true' && env.PUBLISH == 'true') || env.CATALOG_ONLY == 'true'
        run: |
          uv run --project scripts python scripts/datasets/census_catalog.py publish --remote "$REMOTE"
          for f in catalog/catalog.json catalog/tiger-2020-block/catalog.json \
                   catalog/tiger-2020-block/tabblock20/collection.json \
                   catalog/tiger-2020-block/tabblock20-h3/collection.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -I "$PUBLIC/$f")
            [ "$code" = "200" ] || { echo "BAD $f -> $code"; exit 1; }
            echo "ok  $f"
          done
