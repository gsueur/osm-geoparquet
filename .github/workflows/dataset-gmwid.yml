# Build and publish GMWID, the GeoMermaids World Infrastructures Dataset
# (OpenStreetMap infrastructure, enriched; power, telecoms, oil and gas, water:
# the content of Open Infrastructure Map) for the whole planet, to
# parquetry:parquetry/gmwid/latest/.
#
# The planet (~89 GB) does not fit a hosted runner, and osmium tags-filter
# reads its input twice, so it cannot stream. So:
#
#   plan    Geofabrik's top-level regions (africa ... south-america).
#   filter  one job per region: download, keep the infrastructure (~0.5%),
#           upload the subset as an artifact.
#   build   merge the subsets (osmium merge writes an object present in two
#           regions once), build every layer, verify every file, and with
#           stage=publish replace latest/.
#
# Only latest/ is published: no dated snapshots, no snapshots.json. Features
# that touch no Geofabrik region (mid-ocean cable nodes, some far-offshore
# platforms) are missing; Geofabrik keeps complete ways, so a cable that
# lands somewhere arrives whole.
#
#   build    everything but the upload; the output is kept as an artifact.
#   publish  the same, then replace latest/ and the repository files.
#
# Runs weekly (Sunday 06:47 UTC) as a publish, and on demand. A failed run
# publishes nothing, so latest/ keeps the previous week; ntfy says which
# (NTFY_TOPIC, the nightly's secret).
#
# Needs the same secrets as the nightly: R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY, R2_ENDPOINT.

name: dataset-gmwid

on:
  schedule:
    # Weekly, Sunday 06:47 UTC: Geofabrik's continental extracts carry the
    # previous evening's data (~20:20 UTC), and off the hour because GitHub
    # queues scheduled runs late at :00. A scheduled run publishes.
    - cron: "47 6 * * 0"
  workflow_dispatch:
    inputs:
      stage:
        description: "build verifies and keeps the output as an artifact; publish also replaces latest/"
        type: choice
        options: [build, publish]
        default: build
      regions:
        description: "Space-separated Geofabrik region ids to limit the run to, e.g. 'central-america' (default: all). Never publish a partial run."
        required: false
        default: ""

concurrency:
  group: dataset-gmwid
  cancel-in-progress: false

env:
  # A scheduled run has no inputs: it is a full publish.
  STAGE: ${{ inputs.stage || 'publish' }}
  REMOTE: parquetry:parquetry/gmwid
  PUBLIC: https://parquetry.geomermaids.com/gmwid
  GAUL_L1: https://parquetry.geomermaids.com/gaul/2024/GAUL_2024_L1.parquet
  OGIM_RECORD: "22835235"
  OGIM_MD5: 99d94e96eefe4d7f561d1a2dbcc1a313
  EEZ_WFS: https://geo.vliz.be/geoserver/MarineRegions/wfs?service=WFS&version=2.0.0&request=GetFeature&typeNames=MarineRegions:eez_land&outputFormat=application/json
  LC_ALL: C.UTF-8
  RCLONE_CONFIG_PARQUETRY_TYPE: s3
  RCLONE_CONFIG_PARQUETRY_PROVIDER: Cloudflare
  RCLONE_CONFIG_PARQUETRY_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  RCLONE_CONFIG_PARQUETRY_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  RCLONE_CONFIG_PARQUETRY_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  RCLONE_CONFIG_PARQUETRY_ACL: private
  RCLONE_CONFIG_PARQUETRY_NO_CHECK_BUCKET: "true"

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Geofabrik top-level regions
        id: plan
        run: |
          curl -fsSL --retry 3 https://download.geofabrik.de/index-v1-nogeom.json -o index.json
          python3 - "${{ inputs.regions }}" <<'EOF' >> "$GITHUB_OUTPUT"
          import json, sys
          only = set(sys.argv[1].split())
          regions = [{"id": p["id"], "url": p["urls"]["pbf"]}
                     for p in (f["properties"] for f in json.load(open("index.json"))["features"])
                     if "parent" not in p and (not only or p["id"] in only)]
          missing = only - {r["id"] for r in regions}
          if missing or not regions:
              sys.exit(f"unknown regions: {sorted(missing)}")
          print("matrix=" + json.dumps({"include": regions}))
          EOF
          cat "$GITHUB_OUTPUT"

  filter:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    name: filter ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Work dir on the runner's big scratch disk
        # / has ~14 GB free on hosted runners; /mnt has ~65 GB. Europe is 35 GB.
        run: |
          sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work
          echo "WORK=/mnt/work" >> "$GITHUB_ENV"
          df -h /mnt

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends osmium-tool
          osmium --version | sed -n 1p

      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --project scripts

      - name: Download ${{ matrix.id }} from Geofabrik
        run: |
          "$GITHUB_WORKSPACE/scripts/fetch_pbf.sh" "${{ matrix.url }}" "$WORK/source.osm.pbf" \
            "osm-geoparquet-infrastructure/1.0 (+https://geoparquet.geomermaids.com/)"
          ls -lh "$WORK/source.osm.pbf"
          osmium fileinfo -g header.option.osmosis_replication_timestamp "$WORK/source.osm.pbf" \
            | tee "$WORK/${{ matrix.id }}.timestamp"

      - name: Keep the infrastructure
        run: |
          start=$(date +%s)
          uv run --project scripts python scripts/datasets/infra.py filter \
            "$WORK/source.osm.pbf" "$WORK/${{ matrix.id }}.osm.pbf"
          echo "filtered in $(( $(date +%s) - start )) s"
          ls -lh "$WORK/${{ matrix.id }}.osm.pbf"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: infra-${{ matrix.id }}
          path: |
            ${{ env.WORK }}/${{ matrix.id }}.osm.pbf
            ${{ env.WORK }}/${{ matrix.id }}.timestamp
          retention-days: 3
          compression-level: 0   # already compressed
          if-no-files-found: error

  build:
    needs: filter
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: Work dir on the runner's big scratch disk
        run: |
          sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work
          echo "WORK=/mnt/work" >> "$GITHUB_ENV"
          df -h /mnt; free -g

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends osmium-tool
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
          osmium --version | sed -n 1p; rclone version | sed -n 1p

      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --project scripts

      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: infra-*
          path: ${{ env.WORK }}/subsets
          merge-multiple: true

      - name: Merge the regions
        run: |
          ls -lh "$WORK/subsets"
          osmium merge "$WORK"/subsets/*.osm.pbf -o "$WORK/planet-infra.osm.pbf" --overwrite
          ls -lh "$WORK/planet-infra.osm.pbf"
          osmium fileinfo -e "$WORK/planet-infra.osm.pbf" | grep -E "Number of (nodes|ways|relations)"

      - name: Marine Regions land + EEZ union
        run: |
          curl -fsSL --retry 5 --retry-delay 30 --retry-all-errors -o "$WORK/eez_land.json" "$EEZ_WFS"
          ls -lh "$WORK/eez_land.json"

      # EIA-860M, the monthly inventory of US generators of 1 MW or more:
      # the build adds the operating plants OSM lacks. EIA's page lists
      # placeholder links for months not yet published (they answer 503), so
      # the newest link that serves a real file wins. No file, no build:
      # latest/ keeps last week rather than silently losing those plants.
      - name: EIA-860M, newest month
        run: |
          python3 - <<'EOF'
          import re, urllib.request, os
          base = "https://www.eia.gov/electricity/data/eia860m/"
          ua = {"User-Agent": "osm-geoparquet-infrastructure/1.0 (+https://geoparquet.geomermaids.com/)"}
          page = urllib.request.urlopen(urllib.request.Request(base, headers=ua)).read().decode()
          months = "january february march april may june july august september october november december".split()
          links = set(re.findall(r'(?:archive/)?xls/([a-z]+)_generator(\d{4})\.xlsx', page))
          ranked = sorted(((int(y), months.index(m), m, y) for m, y in links if m in months), reverse=True)
          for _, _, m, y in ranked:
              for path in (f"xls/{m}_generator{y}.xlsx", f"archive/xls/{m}_generator{y}.xlsx"):
                  try:
                      r = urllib.request.urlopen(urllib.request.Request(base + path, headers=ua), timeout=120)
                      data = r.read()
                  except Exception:
                      continue
                  if len(data) > 1_000_000:
                      open(os.environ["WORK"] + "/eia860m.xlsx", "wb").write(data)
                      open(os.environ["WORK"] + "/eia_month.txt", "w").write(f"{m.capitalize()} {y}")
                      print(f"EIA-860M {m} {y}: {len(data):,} bytes")
                      raise SystemExit(0)
          raise SystemExit("no EIA-860M workbook could be downloaded")
          EOF

      # USPVDB (USGS/LBNL): outlines of US solar farms, keyed by EIA plant ID,
      # for the solar plants the EIA step adds. Required like EIA.
      - name: USPVDB, solar outlines
        run: |
          curl -fsSL --retry 5 --retry-delay 30 --retry-all-errors \
            -o "$WORK/uspvdb.zip" https://energy.usgs.gov/uspvdb/assets/data/uspvdbGeoJSON.zip
          unzip -l "$WORK/uspvdb.zip" | grep -o 'uspvdb_v[0-9_]*\.geojson' | tee "$WORK/uspvdb_version.txt"

      # NSTA open data (UK offshore infrastructure and wells): the UK wells,
      # platforms and pipelines OSM lacks, published apart in nsta/ because
      # NSTA's User Agreement is non-commercial (not ODbL-compatible).
      # Required like EIA: no file, no build.
      - name: NSTA, UK offshore infrastructure
        run: |
          curl -fsSL --retry 5 --retry-delay 30 --retry-all-errors -o "$WORK/UKCS_OFF_WGS84_SHP.zip" \
            https://datanstauthority.blob.core.windows.net/external/OpenDataZips/UKCS_OFF_WGS84_SHP.zip
          unzip -l "$WORK/UKCS_OFF_WGS84_SHP.zip" | grep -c '\.shp$'

      # USWTDB (USGS/LBNL/ACP): every US utility-scale wind turbine; the ones
      # OSM lacks go into power_generator. Public domain. Required like EIA.
      - name: USWTDB, wind turbines
        run: |
          curl -fsSL --retry 5 --retry-delay 30 --retry-all-errors \
            -o "$WORK/uswtdb.zip" https://energy.usgs.gov/uswtdb/assets/data/uswtdbCSV.zip
          unzip -l "$WORK/uswtdb.zip" | grep -o 'uswtdb_V[0-9_]*\.csv' | tee "$WORK/uswtdb_version.txt"

      # FCC Antenna Structure Registration, the weekly complete file (rebuilt
      # every Sunday): constructed US communication towers, into telecom_mast.
      - name: FCC ASR, antenna structures
        run: |
          curl -fsSL --retry 5 --retry-delay 30 --retry-all-errors \
            -o "$WORK/r_tower.zip" https://data.fcc.gov/download/pub/uls/complete/r_tower.zip
          unzip -l "$WORK/r_tower.zip" | grep -E ' (RA|CO|EN)\.dat$'

      # BSEE boreholes and platform structures (daily) and BOEM pipeline
      # segments (monthly): the US offshore wells, platforms and pipelines.
      - name: BOEM/BSEE, US offshore oil and gas
        run: |
          mkdir -p "$WORK/boem"
          for url in https://www.data.bsee.gov/Well/Files/BoreholeRawData.zip \
                     https://www.data.bsee.gov/Platform/Files/PlatStrucRawData.zip \
                     https://www.data.boem.gov/Mapping/Files/ppl_arcs.zip; do
            curl -fsSL --retry 5 --retry-delay 30 --retry-all-errors -o "$WORK/boem.zip" "$url"
            unzip -oq "$WORK/boem.zip" -d "$WORK/boem"
          done
          rm "$WORK/boem.zip"
          ls -lR "$WORK/boem" | grep -E '\.(txt|shp)$'

      # Agence ORE: the HTA/BT substations of every French distribution
      # operator (Licence Ouverte 2.0). No bulk file: paged through its API.
      - name: ORE, French distribution substations
        run: |
          uv run --project scripts python scripts/datasets/infra.py fetch-ore "$WORK/ore.csv"

      # OGIM v3.0 (EDF/MethaneSAT, CC BY 4.0): the world's oil and gas
      # infrastructure from ~190 public sources, one 3.4 GB GeoPackage. A
      # fixed release, so it is cached between runs; Zenodo serves one stream
      # at ~1 MB/s, so a cold download uses parallel ranges. A new release is
      # a change to OGIM_RECORD and OGIM_MD5.
      - name: OGIM, cached
        id: ogim
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.WORK }}/ogim.gpkg
          key: ogim-${{ env.OGIM_RECORD }}-${{ env.OGIM_MD5 }}

      - name: OGIM, download
        if: steps.ogim.outputs.cache-hit != 'true'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends aria2
          aria2c -q -x 12 -s 12 --retry-wait 30 --max-tries 5 -d "$WORK" -o ogim.gpkg \
            "https://zenodo.org/api/records/$OGIM_RECORD/files/OGIM_v3.0.gpkg/content"

      - name: OGIM, check
        run: |
          echo "$OGIM_MD5  $WORK/ogim.gpkg" | md5sum -c -

      - name: Build and verify every file
        working-directory: ${{ env.WORK }}   # DuckDB spill files land here, not on /
        env:
          # DuckDB is capped at 55% of RAM (8.8 GB here), and the same build
          # peaks at 8.75 GB on macOS, but reached 14.1 GB on this runner:
          # glibc keeps a malloc arena per thread and returns little to the
          # OS. Two arenas bound that; a hypothesis until a run shows it.
          MALLOC_ARENA_MAX: "2"
        run: |
          /usr/bin/time -v uv run --project "$GITHUB_WORKSPACE/scripts" \
            python "$GITHUB_WORKSPACE/scripts/datasets/infra.py" build "$WORK/planet-infra.osm.pbf" \
            --out-dir "$WORK/out/latest" --work-dir "$WORK/build" \
            --land "$GAUL_L1" --eez "$WORK/eez_land.json" --eia "$WORK/eia860m.xlsx" \
            --uspvdb "$WORK/uspvdb.zip" --nsta "$WORK/UKCS_OFF_WGS84_SHP.zip" \
            --uswtdb "$WORK/uswtdb.zip" --fcc "$WORK/r_tower.zip" --boem "$WORK/boem" \
            --ore "$WORK/ore.csv" --ogim "$WORK/ogim.gpkg" \
            2> >(tee "$WORK/time.txt" >&2)
          grep -E "Elapsed|Maximum resident" "$WORK/time.txt"
          rm -rf "$WORK/build"
          du -sh "$WORK/out/latest" "$WORK/out/nsta"
          ls -la "$WORK/out/latest" "$WORK/out/nsta"

      - name: ATTRIBUTION.txt
        run: |
          stamps=$(for f in "$WORK"/subsets/*.timestamp; do
            printf '    %-18s %s\n' "$(basename "$f" .timestamp)" "$(cat "$f")"; done)
          cat > "$WORK/out/ATTRIBUTION.txt" <<EOF
          GMWID, GeoMermaids World Infrastructures Dataset
          ================================================

          Worldwide power, telecoms, oil and gas, and water infrastructure from
          OpenStreetMap, measured against and completed from authoritative open
          sources. https://gmwid.geomermaids.com

          Data
            (c) OpenStreetMap contributors, available under the Open Database
            License (ODbL) 1.0: https://www.openstreetmap.org/copyright
            This is a derived database and is itself available under the ODbL.
            Source: Geofabrik's top-level extracts (https://download.geofabrik.de/),
            as of:
          $stamps

          US power plants OSM does not have (origin = 'eia' in power_plant)
            U.S. Energy Information Administration, Preliminary Monthly Electric
            Generator Inventory (EIA-860M), $(cat "$WORK/eia_month.txt" 2>/dev/null)
            https://www.eia.gov/electricity/data/eia860m/. Public domain (U.S.
            federal government work). Coverage of EIA's plants by OSM, and what
            was added: latest/_coverage.json.
            Outlines of the solar plants added: U.S. Geological Survey and Lawrence
            Berkeley National Laboratory, United States Large-Scale Solar
            Photovoltaic Database (USPVDB), $(cat "$WORK/uspvdb_version.txt" 2>/dev/null).
            https://energy.usgs.gov/uspvdb/. Public domain.

          US wind turbines OSM does not have (origin = 'uswtdb' in power_generator)
            Hoen, B.D., Diffendorfer, J.E., Rand, J.T., Kramer, L.A., Garrity, C.P.,
            and Hunt, H.E., United States Wind Turbine Database, $(cat "$WORK/uswtdb_version.txt" 2>/dev/null).
            U.S. Geological Survey, American Clean Power Association, and Lawrence
            Berkeley National Laboratory. https://energy.usgs.gov/uswtdb/. Public domain.

          US communication towers OSM does not have (origin = 'fcc' in telecom_mast)
            Federal Communications Commission, Antenna Structure Registration,
            weekly complete file, https://www.fcc.gov/uls/transactions/daily-weekly.
            Public domain (U.S. federal government work).

          US offshore wells, platforms and pipelines OSM does not have (origin = 'boem')
            Bureau of Safety and Environmental Enforcement, borehole and platform
            structure data (https://www.data.bsee.gov/), and Bureau of Ocean Energy
            Management, pipeline segments (https://www.data.boem.gov/). Public domain
            (U.S. federal government work).

          Oil and gas wells, sites, platforms and pipelines OSM does not have (origin = 'ogim')
            Contains data from the Oil and Gas Infrastructure Mapping (OGIM) database
            v3.0, Environmental Defense Fund and MethaneSAT, LLC,
            https://doi.org/10.5281/zenodo.22835235. Licence: CC BY 4.0.
            Omara, M., et al. (2023), Developing a spatially explicit global oil and
            gas infrastructure database for characterizing methane emission sources
            at high resolution, Earth Syst. Sci. Data, 15, 3761-3790.
            Records from sources whose terms restrict reuse, or that are taken
            from their producer, are left out: see latest/_coverage.json
            (ogim.excluded_sources).

          French distribution substations OSM does not have (origin = 'ore' in power_substation)
            Agence ORE, Postes de distribution publique (postes HTA/BT),
            https://opendata.agenceore.fr/, downloaded $(date -u +'%-d %B %Y').
            Licence Ouverte 2.0 (Etalab), https://www.etalab.gouv.fr/licence-ouverte-open-licence/.

          UK wells, platforms and pipelines OSM does not have: nsta/, NOT ODbL
            Contains information provided by the North Sea Transition Authority
            and/or other third parties. Under the NSTA User Agreement
            (non-commercial use only), which is why they are not in latest/:
            see nsta/LICENSE.txt. How OSM compares: latest/_coverage.json.

          Layers, attributes and derived values
            Follow the data model of Open Infrastructure Map
            (https://openinframap.org, code at github.com/openinframap/openinframap,
            BSD-style licence): its layers, the attributes its map serves, and its
            rules for voltages, outputs, solar estimates and pipeline categories.
            Not affiliated with or endorsed by Open Infrastructure Map.

          The country and state columns
            Land: FAO GAUL 2024 level 1; state is the unit's name as a slug
            (texas, bayern)
            (https://parquetry.geomermaids.com/gaul/2024/ATTRIBUTION.txt).
              FAO. 2024. Global Administrative Unit Layers (GAUL).
              [Accessed on $(date -u +'%-d %B %Y')]. https://data.apps.fao.org/?lang=en.
              Licence: CC-BY-4.0
            Offshore (state _offshore): Flanders Marine Institute (2024). Union of
            the ESRI Country shapefile and the Exclusive Economic Zones, via the
            Marine Regions WFS (MarineRegions:eez_land). https://www.marineregions.org.
            Licence: CC BY 4.0.
            High seas: country and state _intl.
            They are a convenience for filtering, assigned from one point on
            each feature. They are not a statement on any boundary or claim.
          EOF
          cat "$WORK/out/ATTRIBUTION.txt"

      - uses: actions/upload-artifact@v7.0.1
        if: env.STAGE == 'build'
        with:
          name: gmwid
          path: ${{ env.WORK }}/out
          retention-days: 3

      - name: Publish
        if: env.STAGE == 'publish'
        run: |
          [ -z "${{ inputs.regions }}" ] || { echo "Refusing to publish a partial run."; exit 1; }
          case "$REMOTE" in
            *:*) ;;
            *) echo "REMOTE=${REMOTE:-<empty>} is not an rclone remote. Refusing."; exit 1 ;;
          esac
          # latest/ is the only version: sync replaces it, removing files the
          # new build no longer has. Data first, then the files that
          # point at it.
          rclone sync "$WORK/out/latest" "$REMOTE/latest" \
            --header-upload "Cache-Control: public, max-age=300, s-maxage=86400, stale-while-revalidate=86400" \
            --transfers 16 --checkers 32 --stats 60s --stats-one-line
          rclone sync "$WORK/out/nsta" "$REMOTE/nsta" \
            --header-upload "Cache-Control: public, max-age=300, s-maxage=86400, stale-while-revalidate=86400" \
            --transfers 4 --stats-one-line
          rclone copy "$WORK/out" "$REMOTE" --max-depth 1 \
            --include index.json --include ATTRIBUTION.txt --ignore-times \
            --header-upload "Cache-Control: public, max-age=300"

      # After the data, so the catalog never links a file that is not there.
      # Rendered from the files just published: rows and sizes match them.
      # The thumbnails are committed (catalog/thumbnails/gmwid/).
      - name: Portolan catalog, published
        if: env.STAGE == 'publish'
        run: |
          uv run --project scripts python scripts/datasets/infra_catalog.py publish \
            --out-dir "$WORK/out/latest" --attribution "$WORK/out/ATTRIBUTION.txt" \
            --remote "$REMOTE"

      - name: Check what is live
        if: env.STAGE == 'publish'
        run: |
          set +e
          fail=0
          for f in index.json ATTRIBUTION.txt latest/_manifest.json latest/abandoned/_manifest.json \
                   latest/power_line.parquet latest/power_tower.parquet \
                   latest/water_well.parquet latest/_coverage.json \
                   nsta/LICENSE.txt nsta/petroleum_well.parquet \
                   catalog/catalog.json catalog/power/power_line/collection.json \
                   catalog/power/power_line/thumbnail.png; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -I "$PUBLIC/$f")
            [ "$code" = "200" ] || { echo "BAD $f -> $code"; fail=1; continue; }
            echo "ok  $f"
          done
          exit $fail

  notify:
    needs: [plan, filter, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FILTER: ${{ needs.filter.result }}
          BUILD: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ -z "$NTFY_TOPIC" ]] && { echo "NTFY_TOPIC not set, skipping"; exit 0; }
          if [[ "$FILTER" == "success" && "$BUILD" == "success" ]]; then
            title="GMWID OK"; tags="white_check_mark"; prio="default"
            if [[ "$STAGE" == "publish" ]]; then msg="published: latest/ replaced"
            else msg="build only: nothing published"; fi
          else
            title="GMWID FAILED"; tags="warning"; prio="high"
            msg="$STAGE: filter=$FILTER build=$BUILD; latest/ unchanged"
          fi
          curl -fsS --max-time 10 -H "Title: $title" -H "Tags: $tags" \
            -H "Priority: $prio" -H "Click: $RUN_URL" -d "$msg" \
            "https://ntfy.sh/$NTFY_TOPIC" >/dev/null || echo "ntfy POST failed"
