# Temporary, issue #5: peak memory of clipping Mexico with smart at
# several extract batch sizes (5, the current default, is the control).
# Runs on pushes to debug/issue-5 that touch it.

name: debug-issue-5-memory

on:
  push:
    branches: ["debug/issue-5"]
    paths:
      - ".github/debug/issue5_memory.py"
      - ".github/workflows/debug-issue-5-memory.yml"

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    name: mexico smart, batch ${{ matrix.batch }}
    strategy:
      fail-fast: false
      matrix:
        batch: [2, 3, 5]
    steps:
      - uses: actions/checkout@v7

      - name: Work dir on the big scratch disk
        run: |
          sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work
          echo "WORK=/mnt/work" >> "$GITHUB_ENV"
          df -h /mnt; free -g

      - name: Tools
        run: |
          bash .github/scripts/install-tools.sh
          sudo apt-get install -y -qq time

      - uses: astral-sh/setup-uv@v10.1.0
      - name: Python deps
        run: uv sync --project scripts

      - name: Admin regions
        run: bash .github/scripts/admin-regions.sh
        env:
          ADMIN_REGIONS_URL: ${{ vars.ADMIN_REGIONS_URL }}

      - name: Download Mexico
        run: |
          curl -fL --retry 5 --retry-delay 30 --retry-all-errors \
            -A "osm-geoparquet-debug/1.0 (+https://geoparquet.geomermaids.com/)" \
            -o "$WORK/source.osm.pbf" https://download.geofabrik.de/north-america/mexico-latest.osm.pbf
          ls -lh "$WORK/source.osm.pbf"

      - name: Measure strategies
        env:
          BATCH: ${{ matrix.batch }}
          STRATEGIES: smart
        run: |
          uv run --project scripts python .github/debug/issue5_memory.py \
            "$WORK/source.osm.pbf" data/admin_regions.geojson "$WORK/debug" MX-
          cat "$WORK/debug/report.md" >> "$GITHUB_STEP_SUMMARY"
