# Temporary, issue #5: cost of clipping with smart / complete_ways on the
# heaviest nightly jobs. Runs on pushes to debug/issue-5 that touch it.

name: debug-issue-5-memory

on:
  push:
    branches: ["debug/issue-5"]
    paths:
      - ".github/debug/issue5_memory.py"
      - ".github/workflows/debug-issue-5-memory.yml"

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    name: ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: us-california
            url: https://download.geofabrik.de/north-america/us/california-latest.osm.pbf
            regions: US-CA
          - id: ca-ontario
            url: https://download.geofabrik.de/north-america/canada/ontario-latest.osm.pbf
            regions: CA-ON
          - id: mexico
            url: https://download.geofabrik.de/north-america/mexico-latest.osm.pbf
            regions: MX-
    steps:
      - uses: actions/checkout@v7

      - name: Work dir on the big scratch disk
        run: |
          sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work
          echo "WORK=/mnt/work" >> "$GITHUB_ENV"
          df -h /mnt; free -g

      - name: Tools
        run: |
          bash .github/scripts/install-tools.sh
          sudo apt-get install -y -qq time

      - uses: astral-sh/setup-uv@v10.1.0
      - name: Python deps
        run: uv sync --project scripts

      - name: Admin regions
        run: bash .github/scripts/admin-regions.sh
        env:
          ADMIN_REGIONS_URL: ${{ vars.ADMIN_REGIONS_URL }}

      - name: Download ${{ matrix.id }}
        run: |
          curl -fL --retry 5 --retry-delay 30 --retry-all-errors \
            -A "osm-geoparquet-debug/1.0 (+https://geoparquet.geomermaids.com/)" \
            -o "$WORK/source.osm.pbf" "${{ matrix.url }}"
          ls -lh "$WORK/source.osm.pbf"

      - name: Measure strategies
        run: |
          uv run --project scripts python .github/debug/issue5_memory.py \
            "$WORK/source.osm.pbf" data/admin_regions.geojson "$WORK/debug" ${{ matrix.regions }}
          cat "$WORK/debug/report.md" >> "$GITHUB_STEP_SUMMARY"
