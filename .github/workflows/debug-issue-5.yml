# Temporary: debug run for issue #5 (admin areas touching the region edge go
# missing). Runs on pushes to the debug/issue-5 branch only; never merged.

name: debug-issue-5

on:
  push:
    branches: ["debug/issue-5"]
    paths:
      - ".github/debug/issue5.py"
      - ".github/workflows/debug-issue-5.yml"

jobs:
  rhode-island:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Tools
        run: |
          bash .github/scripts/install-tools.sh
          sudo apt-get install -y -qq time

      - uses: astral-sh/setup-uv@v10.1.0
      - name: Python deps
        run: uv sync --project scripts

      - name: Admin regions
        run: bash .github/scripts/admin-regions.sh
        env:
          ADMIN_REGIONS_URL: ${{ vars.ADMIN_REGIONS_URL }}

      - name: Download Rhode Island from Geofabrik
        run: |
          curl -fL --retry 5 --retry-delay 30 --retry-all-errors \
            -A "osm-geoparquet-debug/1.0 (+https://geoparquet.geomermaids.com/)" \
            -o "$RUNNER_TEMP/source.osm.pbf" \
            https://download.geofabrik.de/north-america/us/rhode-island-latest.osm.pbf
          ls -lh "$RUNNER_TEMP/source.osm.pbf"

      - name: Pipeline, boundaries only, keeping intermediates
        run: |
          uv run --project scripts python scripts/pipeline.py \
            --source-pbf "$RUNNER_TEMP/source.osm.pbf" \
            --states-geojson data/admin_regions.geojson \
            --out-dir "$RUNNER_TEMP/out" \
            --states US-RI --themes boundaries --keep-intermediate --verbose
          find "$RUNNER_TEMP/out" -maxdepth 4 -type f | sort

      - name: Compare stages
        run: |
          uv run --project scripts python .github/debug/issue5.py \
            "$RUNNER_TEMP/source.osm.pbf" \
            "$RUNNER_TEMP/out/_work/US-RI/US-RI.geojson" \
            "$RUNNER_TEMP/out/_work/US-RI/US-RI.osm.pbf" \
            "$RUNNER_TEMP/out/country=US/state=US-RI/boundaries.parquet" \
            "$RUNNER_TEMP/debug"
          cat "$RUNNER_TEMP/debug/report.md" >> "$GITHUB_STEP_SUMMARY"
