# One-shot: put the hand-made whole-world GAUL files online.
#
# The whole-world L1 and L2 were rewritten outside gaul.py (pyarrow +
# geoarrow, row groups of at most 42 MB, GAUL codes as BIGINT) and put in
# the bucket by hand under their GAUL_2024_ names. This workflow fetches
# them back, verifies them the way gaul.py verifies its own output, renames
# the L0 file to match, rewrites the manifest entries, republishes the
# catalog from what is online, and only then deletes the old names.
#
# Dispatch only. Nothing is deleted before the catalog describing the new
# files is live.

name: gaul-whole-world

on:
  workflow_dispatch:
    inputs:
      delete_old:
        description: "Delete L0_derived.parquet, L1.parquet and L2.parquet once the catalog is live"
        type: boolean
        default: true

env:
  REMOTE: parquetry:parquetry/gaul
  VERSION: "2024"
  PUBLIC: https://parquetry.geomermaids.com/gaul
  LC_ALL: C.UTF-8
  RCLONE_CONFIG_PARQUETRY_TYPE: s3
  RCLONE_CONFIG_PARQUETRY_PROVIDER: Cloudflare
  RCLONE_CONFIG_PARQUETRY_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  RCLONE_CONFIG_PARQUETRY_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  RCLONE_CONFIG_PARQUETRY_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  RCLONE_CONFIG_PARQUETRY_ACL: private
  RCLONE_CONFIG_PARQUETRY_NO_CHECK_BUCKET: "true"
  IMMUTABLE: "Cache-Control: public, max-age=31536000, immutable"

jobs:
  replace:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --project scripts

      - name: rclone
        run: |
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
          rclone version | sed -n 1p

      - name: Fetch the new files from the bucket
        run: |
          mkdir -p new
          for l in L1 L2; do
            rclone copyto "$REMOTE/$VERSION/GAUL_${VERSION}_$l.parquet" "new/GAUL_${VERSION}_$l.parquet"
          done
          ls -la new

      - name: Verify them as gaul.py would (footer, covering, bbox bounds, extent)
        run: |
          uv run --project scripts python - <<'PY'
          import sys; sys.path.insert(0, "scripts/datasets")
          from pathlib import Path
          import duckdb, gaul
          con = duckdb.connect(); con.execute("INSTALL spatial; LOAD spatial;")
          gaul.verify(con, Path("new"), [f"GAUL_{gaul.VERSION}_L1", f"GAUL_{gaul.VERSION}_L2"])
          for lvl in ("L1", "L2"):
              t = con.execute(f"SELECT typeof(gaul0_code) FROM read_parquet('new/GAUL_{gaul.VERSION}_{lvl}.parquet') LIMIT 1").fetchone()[0]
              assert t == "BIGINT", f"{lvl}: gaul0_code is {t}"
          print("  codes are BIGINT")
          PY

      - name: Rename L0, and pin the cache headers on the new files
        run: |
          # The hand upload may not have set Cache-Control; rewrite the
          # metadata in place (server-side copy onto itself, metadata replaced).
          for l in L1 L2; do
            rclone copyto --metadata --metadata-set "cache-control=public, max-age=31536000, immutable" \
              --metadata-set "content-type=application/vnd.apache.parquet" --ignore-times \
              "$REMOTE/$VERSION/GAUL_${VERSION}_$l.parquet" "$REMOTE/$VERSION/GAUL_${VERSION}_$l.parquet"
          done
          # Same bytes under the new name; a server-side copy keeps the metadata.
          rclone copyto "$REMOTE/$VERSION/L0_derived.parquet" "$REMOTE/$VERSION/GAUL_${VERSION}_L0_derived.parquet"
          rclone lsjson "$REMOTE/$VERSION/" --files-only | python3 -c 'import json,sys; [print(f"  {e[\"Name\"]:32} {e[\"Size\"]:>12}") for e in json.load(sys.stdin)]'

      - name: Rewrite the manifest
        run: |
          rclone copyto "$REMOTE/$VERSION/_manifest.json" manifest.json
          uv run --project scripts python scripts/datasets/gaul_manifest.py --manifest manifest.json \
            --replace "L1=new/GAUL_${VERSION}_L1.parquet" --replace "L2=new/GAUL_${VERSION}_L2.parquet" \
            --rename "L0_derived=GAUL_${VERSION}_L0_derived.parquet" \
            --note "geopq-workbench 0.9.1, GAUL codes cast to BIGINT with pyarrow + geoarrow; published by hand 2026-09-23"
          rclone copyto --ignore-times --header-upload "Cache-Control: public, max-age=300" \
            manifest.json "$REMOTE/$VERSION/_manifest.json"

      - name: Republish the catalog from what is online
        run: |
          uv run --project scripts python scripts/datasets/gaul_catalog.py publish --remote "$REMOTE"

      - name: Check what is live
        run: |
          set +e
          fail=0
          for f in $VERSION/GAUL_${VERSION}_L0_derived.parquet $VERSION/GAUL_${VERSION}_L1.parquet \
                   $VERSION/GAUL_${VERSION}_L2.parquet $VERSION/_manifest.json \
                   catalog/catalog.json catalog/l1/collection.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -I "$PUBLIC/$f")
            [ "$code" = "200" ] || { echo "BAD $f -> $code"; fail=1; continue; }
            echo "ok  $f"
          done
          curl -fsSL "$PUBLIC/catalog/l1/collection.json" | python3 -c '
          import json, sys; d = json.load(sys.stdin); a = d["assets"]["data"]
          print("  catalog l1 data asset:", a["href"].rsplit("/", 1)[1], a["file:size"], a["file:checksum"][:20])'
          exit $fail

      - name: Delete the old names
        if: inputs.delete_old
        run: |
          for f in L0_derived.parquet L1.parquet L2.parquet; do
            rclone deletefile "$REMOTE/$VERSION/$f" && echo "deleted $f"
          done
          for f in L0_derived.parquet L1.parquet L2.parquet; do
            curl -s -o /dev/null -w "$f -> %{http_code} (expect 404)\n" -I "$PUBLIC/$VERSION/$f"
          done
