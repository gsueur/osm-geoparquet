# Build and publish FAO GAUL 2024 to parquetry:parquetry/gaul/2024/.
#
# GAUL is a static release, not a nightly feed, so this runs on demand rather
# than on a schedule. It runs here rather than on a laptop because this is
# where the R2 credentials work, and because the source is 873 MB of zipped
# shapefile that a runner fetches faster than a home connection.
#
# The converter verifies its own output before anything is uploaded: one
# `geo` footer key, a well-formed covering, a bbox that really bounds every
# geometry, and a declared extent that matches the data. A failure there
# fails the job with nothing published.
#
#   build    convert, tile and verify, upload nothing. Use it to check a change.
#   publish  the same, then upload to the bucket.
#   tiles    only the PMTiles, from the whole-world files already published:
#            tile them, add them to the live manifest, upload the archives
#            and the manifest, republish the catalog. The parquet files and
#            the citation's access date stay as they are.
#
# The PMTiles archives (GAUL_2024_<layer>.pmtiles, beside the parquet) are
# built by tylertoo, pinned and checksummed in scripts/datasets/pmtiles.py.
#
# Needs the same secrets as the nightly: R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY, R2_ENDPOINT.

name: dataset-gaul

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "build converts and renders the catalog, verifying both; publish also uploads them; tiles only adds the PMTiles to the published release"
        type: choice
        options: [build, publish, tiles]
        default: build
      accessed:
        description: "Access date for the required FAO citation (YYYY-MM-DD, default: today UTC)"
        required: false
        default: ""

# GAUL 2024 is a static release. gaul.py caps row groups at 4 MiB of
# geometry (pyarrow + geoarrow, since DuckDB writes none under 2,048 rows),
# for the whole-world files and the per-country ones alike, so a publish
# re-run reproduces what is online. The parquet files are uploaded as
# immutable. Cloudflare does not cache them (the files Worker answers every
# request from R2), but a browser can: after a publish that changes bytes, a
# browser-based reader that saw the old file needs a hard reload.

concurrency:
  group: dataset-gaul
  cancel-in-progress: false

env:
  REMOTE: parquetry:parquetry/gaul
  VERSION: "2024"
  PUBLIC: https://parquetry.geomermaids.com/gaul
  LC_ALL: C.UTF-8
  RCLONE_CONFIG_PARQUETRY_TYPE: s3
  RCLONE_CONFIG_PARQUETRY_PROVIDER: Cloudflare
  RCLONE_CONFIG_PARQUETRY_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  RCLONE_CONFIG_PARQUETRY_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  RCLONE_CONFIG_PARQUETRY_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  RCLONE_CONFIG_PARQUETRY_ACL: private
  RCLONE_CONFIG_PARQUETRY_NO_CHECK_BUCKET: "true"

jobs:
  gaul:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --project scripts

      - name: tylertoo
        run: |
          uv run --project scripts python scripts/datasets/pmtiles.py install --dest "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: rclone
        if: inputs.stage != 'build'
        run: |
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
          rclone version | sed -n 1p

      - name: Fetch the FAO archives
        if: inputs.stage != 'tiles'
        run: |
          mkdir -p work
          for lvl in L1 L2; do
            curl -fsSL --retry 3 -o "work/GAUL_2024_$lvl.zip" \
              "https://storage.googleapis.com/fao-maps-catalog-data/boundaries/GAUL_2024_$lvl.zip"
            unzip -oq "work/GAUL_2024_$lvl.zip" -d work
            rm "work/GAUL_2024_$lvl.zip"
          done
          ls -la work/*.shp
          df -h . | tail -1

      # GAUL2024TermsOfUse.pdf ships inside both archives and is the document
      # the attribution is quoted from. Publishing it beside the data means a
      # reader can check our summary against the source.
      - name: Convert, tile and verify
        if: inputs.stage != 'tiles'
        run: |
          uv run --project scripts python scripts/datasets/gaul.py \
            --work-dir work --out-dir "out/$VERSION" \
            ${{ inputs.accessed && format('--accessed {0}', inputs.accessed) || '' }}
          cp work/GAUL2024TermsOfUse.pdf "out/$VERSION/"
          ls -la "out/$VERSION"
          echo "per-country files: $(find "out/$VERSION" -path '*country=*' -name '*.parquet' | wc -l)"

      # The published release, whole-world files and manifest, read back
      # through rclone so the bytes tiled are the bytes online.
      - name: Tile the published release
        if: inputs.stage == 'tiles'
        run: |
          mkdir -p "out/$VERSION"
          rclone copy "$REMOTE/$VERSION" "out/$VERSION" --max-depth 1 \
            --include "GAUL_${VERSION}_*.parquet" --include _manifest.json --transfers 4
          uv run --project scripts python scripts/datasets/gaul.py --tiles-only --out-dir "out/$VERSION"
          jq -c '.pmtiles[] | {file, min_zoom, max_zoom, tiles, bytes}' "out/$VERSION/_manifest.json"

      # The catalog needs a thumbnail per collection. They are committed under
      # catalog/thumbnails/gaul/ and only re-rendered here when missing (a new
      # layer, or a fresh checkout after they were removed), then attached as
      # an artifact so they can be committed.
      - name: Thumbnails, when missing
        run: |
          missing=$(for l in L0_derived L1 L2; do
            [ -f "catalog/thumbnails/gaul/$l.png" ] || echo "$l"; done)
          if [ -n "$missing" ]; then
            uv run --project scripts --with matplotlib \
              python scripts/datasets/gaul_catalog.py thumbnails \
              --out-dir "out/$VERSION" --layers $missing
          fi
          ls -la catalog/thumbnails/gaul/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: gaul-thumbnails
          path: catalog/thumbnails/gaul/
          if-no-files-found: error

      # rashid over the rendered tree, before anything is uploaded. The data
      # assets are remote hrefs, so this is the metadata pass plus the bytes
      # of the thumbnails; the parquet files were verified by gaul.py above.
      - name: STAC catalog, rendered and checked
        run: |
          uv run --project scripts python scripts/datasets/gaul_catalog.py \
            build --out-dir "out/$VERSION" --dest build/catalog
          uv run --project scripts python scripts/datasets/gaul_catalog.py \
            check build/catalog

      - name: Upload
        if: inputs.stage == 'publish'
        run: |
          case "$REMOTE" in
            *:*) ;;
            *) echo "REMOTE=${REMOTE:-<empty>} is not an rclone remote. Refusing."; exit 1 ;;
          esac
          # A static release, so the data is immutable; the manifest and the
          # attribution are the two a correction would touch, and they get the
          # short max-age the other datasets use for their metadata.
          rclone copy "out/$VERSION" "$REMOTE/$VERSION" \
            --include "*.parquet" --include "*.pdf" \
            --header-upload "Cache-Control: public, max-age=31536000, immutable" \
            --transfers 4 --stats 30s --stats-one-line
          rclone copy "out/$VERSION" "$REMOTE/$VERSION" --max-depth 1 --include "*.pmtiles" \
            --header-upload "Cache-Control: public, max-age=31536000, immutable" \
            --header-upload "Content-Type: application/vnd.pmtiles" --transfers 3
          rclone copy "out/$VERSION" "$REMOTE/$VERSION" \
            --include "_manifest.json" --include "ATTRIBUTION.txt" --ignore-times \
            --header-upload "Cache-Control: public, max-age=300"

      # The archives first, then the manifest that names them.
      - name: Upload the PMTiles
        if: inputs.stage == 'tiles'
        run: |
          rclone copy "out/$VERSION" "$REMOTE/$VERSION" --max-depth 1 --include "*.pmtiles" \
            --header-upload "Cache-Control: public, max-age=31536000, immutable" \
            --header-upload "Content-Type: application/vnd.pmtiles" --transfers 3
          rclone copyto "out/$VERSION/_manifest.json" "$REMOTE/$VERSION/_manifest.json" \
            --ignore-times --header-upload "Cache-Control: public, max-age=300"

      # After the data, so the catalog never links a file that is not there.
      - name: STAC catalog, published
        if: inputs.stage != 'build'
        run: |
          uv run --project scripts python scripts/datasets/gaul_catalog.py \
            publish --out-dir "out/$VERSION" --remote "$REMOTE"

      - name: Check what is live
        if: inputs.stage != 'build'
        run: |
          set +e
          fail=0
          for f in $VERSION/GAUL_${VERSION}_L0_derived.parquet $VERSION/GAUL_${VERSION}_L1.parquet \
                   $VERSION/GAUL_${VERSION}_L2.parquet \
                   $VERSION/GAUL_${VERSION}_L0_derived.pmtiles $VERSION/GAUL_${VERSION}_L1.pmtiles \
                   $VERSION/GAUL_${VERSION}_L2.pmtiles catalog/l2/styles/default.json \
                   $VERSION/_manifest.json $VERSION/ATTRIBUTION.txt \
                   $VERSION/GAUL2024TermsOfUse.pdf \
                   $VERSION/country=FRA/L1.parquet $VERSION/country=xAB/L2.parquet \
                   catalog/catalog.json catalog/l2/collection.json catalog/l2/thumbnail.png; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -I "$PUBLIC/$f")
            [ "$code" = "200" ] || { echo "BAD $f -> $code"; fail=1; continue; }
            echo "ok  $f"
          done
          type=$(curl -sI "$PUBLIC/$VERSION/GAUL_${VERSION}_L1.pmtiles" | tr -d '\r' |
                 awk 'tolower($1)=="content-type:"{print $2}')
          [ "$type" = "application/vnd.pmtiles" ] || { echo "BAD pmtiles Content-Type: $type"; fail=1; }
          range=$(curl -s -o /dev/null -w '%{http_code}' -r 0-126 "$PUBLIC/$VERSION/GAUL_${VERSION}_L1.pmtiles")
          [ "$range" = "206" ] || { echo "BAD pmtiles range request -> $range"; fail=1; }
          exit $fail
