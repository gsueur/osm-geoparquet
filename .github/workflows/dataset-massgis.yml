# MassGIS statewide vector layers: parquetry:parquetry/massgis/.
#
# One GeoParquet file and one PMTiles archive per layer, under
# massgis/<theme>/. scripts/datasets/massgis.py documents the layout;
# scripts/datasets/massgis_layers.csv says which layers are built.
#
# MassGIS replaces a layer's zip in its bucket when the layer changes, a few
# layers a month. A weekly run compares each layer's fingerprint (the ETags
# of its zips) with the published massgis/_source.json and rebuilds only the
# layers that moved; the manifests keep the others' published entries.
#
#   build    fetch, convert, tile and verify what moved, upload nothing
#   publish  the same, then upload (a scheduled run publishes), then the
#            Portolan catalog at /massgis/catalog/
#   catalog  only the catalog, rendered from the files already published
#
# Needs the R2 secrets the nightly uses.

name: dataset-massgis

on:
  schedule:
    - cron: "41 9 * * 3"
  workflow_dispatch:
    inputs:
      stage:
        description: "build writes and verifies; publish also uploads; catalog only the catalog"
        type: choice
        options: [build, publish, catalog]
        default: build
      force:
        description: "Rebuild every layer, moved or not"
        type: boolean
        default: false

concurrency:
  group: dataset-massgis
  cancel-in-progress: false

env:
  REMOTE: parquetry:parquetry/massgis
  PUBLIC: https://parquetry.geomermaids.com/massgis
  PUBLISH: ${{ github.event_name == 'schedule' || inputs.stage == 'publish' }}
  CATALOG_ONLY: ${{ inputs.stage == 'catalog' }}
  LC_ALL: C.UTF-8
  RCLONE_CONFIG_PARQUETRY_TYPE: s3
  RCLONE_CONFIG_PARQUETRY_PROVIDER: Cloudflare
  RCLONE_CONFIG_PARQUETRY_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  RCLONE_CONFIG_PARQUETRY_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  RCLONE_CONFIG_PARQUETRY_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  RCLONE_CONFIG_PARQUETRY_ACL: private
  RCLONE_CONFIG_PARQUETRY_NO_CHECK_BUCKET: "true"
  # Files are replaced in place when MassGIS updates a layer: a short cache.
  CACHE: "Cache-Control: public, max-age=3600"

jobs:
  massgis:
    runs-on: ubuntu-24.04
    # A weekly run rebuilds a handful of layers in minutes. A forced run
    # rebuilds all of them: about 11 GB of zips, and land cover alone
    # (22.8 million polygons) is the longest layer.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --project scripts

      - name: Anything new upstream?
        id: check
        run: |
          uv run --project scripts python scripts/datasets/massgis.py upstream > upstream.json
          live=$(curl -fsS "$PUBLIC/_source.json" || echo '{}')
          moved=$(jq -r --argjson was "$live" \
            'to_entries | map(select(.value.fingerprint != $was[.key].fingerprint)) | map(.key) | join(" ")' \
            upstream.json)
          echo "moved: ${moved:-none}"
          if [ "$CATALOG_ONLY" = "true" ]; then
            echo "catalog only"; echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$moved" ] && [ "${{ inputs.force }}" != "true" ] && [ "$PUBLISH" = "true" ]; then
            echo "nothing moved upstream"; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Work dir on the runner's big scratch disk
        if: steps.check.outputs.go == 'true'
        run: |
          sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work
          echo "WORK=/mnt/work" >> "$GITHUB_ENV"
          df -h /mnt; free -g

      # GDAL's ogr2ogr linearizes the geodatabase layers (massgis.py, linearized()).
      # From this image, not apt: Ubuntu's 3.8.4 writes parcel geometries DuckDB
      # cannot read (l3_misc_poly, l3_othleg_poly), 3.13.3 does not. It needs only
      # $WORK, where the source and the output both live.
      - name: Fetch, convert, tile and verify
        if: steps.check.outputs.go == 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/ogr2ogr" <<EOF
          #!/usr/bin/env bash
          exec docker run --rm -u "\$(id -u):\$(id -g)" -v "$WORK:$WORK" ghcr.io/osgeo/gdal:ubuntu-small-3.13.3 ogr2ogr "\$@"
          EOF
          chmod +x "$HOME/.local/bin/ogr2ogr"
          export PATH="$HOME/.local/bin:$PATH" TMPDIR="$WORK/tmp"
          ogr2ogr --version
          uv run --project scripts python scripts/datasets/pmtiles.py install --dest "$HOME/.local/bin"
          mkdir -p "$TMPDIR"
          /usr/bin/time -v uv run --project scripts --with matplotlib python scripts/datasets/massgis.py build \
            --src-dir "$WORK/src" --work-dir "$WORK/tmp" --out-dir "$WORK/out" \
            ${{ inputs.force && '--force' || '' }} 2> >(tee "$WORK/time.txt" >&2)
          grep -E "Maximum resident|Elapsed" "$WORK/time.txt"
          du -sh "$WORK/out"; find "$WORK/out" -type f | sort | sed "s|$WORK/out/||"

      - name: rclone
        if: (steps.check.outputs.go == 'true' && env.PUBLISH == 'true') || env.CATALOG_ONLY == 'true'
        run: |
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
          rclone version | sed -n 1p

      # The data first, then the manifests and the repository files that
      # name it: a reader never finds a path that is not there yet. out/
      # holds only the layers just built, so copy, never sync.
      - name: Publish
        if: steps.check.outputs.go == 'true' && env.PUBLISH == 'true'
        run: |
          out="$WORK/out"
          rclone copy "$out" "$REMOTE" --include "*.parquet" \
            --header-upload "$CACHE" --header-upload "Content-Type: application/vnd.apache.parquet" \
            --transfers 6 --stats 30s --stats-one-line
          rclone copy "$out" "$REMOTE" --include "*.pmtiles" \
            --header-upload "$CACHE" --header-upload "Content-Type: application/vnd.pmtiles" \
            --transfers 6 --stats 30s --stats-one-line
          rclone copy "$out" "$REMOTE" --include "*.png" --header-upload "$CACHE" --transfers 16
          rclone copy "$out" "$REMOTE" --include "_manifest.json" --include "ATTRIBUTION.txt" \
            --ignore-times --header-upload "Cache-Control: public, max-age=300"
          rclone copy "$out" "$REMOTE" --max-depth 1 --include index.json --include snapshots.json \
            --include _source.json --ignore-times --header-upload "Cache-Control: public, max-age=300"

      - name: Check what is live
        if: steps.check.outputs.go == 'true' && env.PUBLISH == 'true'
        run: |
          set +e
          fail=0
          for f in index.json _source.json parcels/_manifest.json parcels/ATTRIBUTION.txt \
                   parcels/l3_taxpar_poly.parquet parcels/l3_taxpar_poly.pmtiles \
                   parcels/l3_assess.parquet buildings/structures_poly.pmtiles \
                   water/hydro25k_poly.parquet land_cover/lclu2016.pmtiles; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -I "$PUBLIC/$f")
            [ "$code" = "200" ] || { echo "BAD $f -> $code"; fail=1; continue; }
            echo "ok  $f"
          done
          range=$(curl -s -o /dev/null -w '%{http_code}' -r 0-126 "$PUBLIC/parcels/l3_taxpar_poly.pmtiles")
          [ "$range" = "206" ] || { echo "BAD pmtiles range request -> $range"; fail=1; }
          exit $fail

      # After the data, so the catalog never links a file that is not there.
      - name: STAC catalog, published
        if: (steps.check.outputs.go == 'true' && env.PUBLISH == 'true') || env.CATALOG_ONLY == 'true'
        run: |
          uv run --project scripts python scripts/datasets/massgis_catalog.py publish --remote "$REMOTE"
          for f in catalog/catalog.json catalog/parcels/catalog.json \
                   catalog/parcels/l3_taxpar_poly/collection.json \
                   catalog/parcels/l3_taxpar_poly/styles/default.json \
                   catalog/parcels/l3_assess/collection.json \
                   catalog/water/hydro25k_poly/collection.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -I "$PUBLIC/$f")
            [ "$code" = "200" ] || { echo "BAD $f -> $code"; exit 1; }
            echo "ok  $f"
          done

      # Last, so a layer that failed does not hold back the others: they are
      # published, the failed one stays as it was (its published fingerprint
      # is kept, so the next run tries it again), and this run goes red.
      - name: Layers that failed
        if: steps.check.outputs.go == 'true'
        run: |
          jq -e 'length == 0' "$WORK/out/failed.json" >/dev/null && exit 0
          jq -r 'to_entries[] | "\(.key): \(.value)"' "$WORK/out/failed.json"
          exit 1
