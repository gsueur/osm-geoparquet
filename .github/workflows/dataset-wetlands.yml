# The USFWS National Wetlands Inventory: parquetry:parquetry/wetlands/.
#
# One GeoParquet file of wetland polygons per state under
# wetlands/nwi/<release>/state=<XX>/, the copies FWS repeats across state
# downloads removed; the code table, the mapping projects, a PMTiles map, and
# the Portolan catalog at wetlands/catalog/. scripts/datasets/nwi.py
# documents the layout, the dedup and the gate.
#
# FWS publishes twice a year (October and May). A weekly run reads the
# download page (its "last updated" month, each unit's zip size and ETag,
# the code table's) and compares it with the published wetlands/_source.json:
# anything new outside Alaska rebuilds the release (a new month is a new
# path; the old release stays until removed by hand). Alaska's zip (11.8 GB)
# does not fit a runner: it is built on a workstation with
# scripts/datasets/nwi_publish_ak.sh, then the map on the same workstation
# with scripts/datasets/nwi_tiles_local.sh, then the catalog stage here.
# Until Alaska is built from the zip FWS lists (a new zip, or a new release),
# the weekly check fails with that instruction.
#
# The national build (52 units, about 35 million rows) is split so that no
# job runs long, through a scratch prefix, wetlands/_work/<release>/:
#
#   plan      the upstream check; the units in groups of about equal zip size;
#             a new run keeps the units an earlier run of the release staged
#   stage     one job per group: each unit staged (nwi.py stage, a process per
#             unit) and uploaded: its rows partitioned by target state, its
#             index (the dedup's columns), its projects, its counts
#   choose    each NWI_ID once, from the indexes only (nwi.py choose); the
#             target states in groups of about equal rows
#   write     one job per group of states: their partitions downloaded, the
#             state files written (nwi.py write) and uploaded to the scratch
#   assemble  the manifest, codes, projects (nwi.py assemble); when publishing,
#             the state files copied server-side to the release, then the
#             files that name them; the scratch prefix removed
#
# The map is not built here: tiling 35 million polygons from z6 to z13 ran a
# runner's disk full (run 42426219352). The catalog names the map, so it is
# rendered last, by the catalog stage, once nwi_tiles_local.sh has uploaded it.
#
# A failed job can be re-run alone ("Re-run failed jobs"), or the workflow
# dispatched again: the scratch prefix is kept until assemble, and a staging
# job skips a unit already uploaded from the same zip and stage version
# (nwi.py STAGE_VERSION). force restages everything.
#
# Stages (dispatch): build (everything, publishes nothing), publish (also
# uploads; a scheduled run publishes), catalog (the catalog only, after
# Alaska and the map). Needs the R2 secrets the nightly uses.

name: dataset-wetlands

on:
  schedule:
    - cron: "41 7 * * 3"
  workflow_dispatch:
    inputs:
      stage:
        description: "build writes and verifies; publish also uploads; catalog only the catalog (after Alaska and the map)"
        type: choice
        options: [build, publish, catalog]
        default: build
      force:
        description: "Rebuild even if nothing moved upstream"
        type: boolean
        default: false

concurrency:
  group: dataset-wetlands
  cancel-in-progress: false

env:
  REMOTE: parquetry:parquetry/wetlands
  PUBLIC: https://parquetry.geomermaids.com/wetlands
  PUBLISH: ${{ github.event_name == 'schedule' || inputs.stage == 'publish' }}
  LC_ALL: C.UTF-8
  RCLONE_CONFIG_PARQUETRY_TYPE: s3
  RCLONE_CONFIG_PARQUETRY_PROVIDER: Cloudflare
  RCLONE_CONFIG_PARQUETRY_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  RCLONE_CONFIG_PARQUETRY_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  RCLONE_CONFIG_PARQUETRY_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  RCLONE_CONFIG_PARQUETRY_ACL: private
  RCLONE_CONFIG_PARQUETRY_NO_CHECK_BUCKET: "true"
  # FWS can re-upload a release under the same month, which rebuilds the
  # same path: the cache the other datasets use, not a long one.
  CACHE: "Cache-Control: public, max-age=3600"
  # DuckDB's limit in every job: well under the runner's 16 GB, the rest for
  # GDAL, GEOS and pyarrow, which DuckDB does not count.
  MEMORY: 5GB

jobs:
  plan:
    if: github.event_name == 'schedule' || inputs.stage == 'build' || inputs.stage == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      go: ${{ steps.check.outputs.go }}
      release: ${{ steps.plan.outputs.release }}
      groups: ${{ steps.plan.outputs.groups }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --project scripts

      - name: Anything new upstream?
        id: check
        run: |
          uv run --project scripts python scripts/datasets/nwi.py upstream > upstream.json
          jq -c '{release, last_updated, units: (.units | length)}' upstream.json
          live=$(curl -fsS "$PUBLIC/_source.json" || echo '{}')
          # Alaska is built on a workstation: compare it apart.
          sig='[.release, (.units | to_entries | map(select(.key != "AK")) | map([.key, .value.etag]) ), .codes.etag]'
          now=$(jq -c "$sig" upstream.json)
          was=$(echo "$live" | jq -c ".nwi // {units: {}, codes: {}} | $sig")
          ak_now=$(jq -c '.units.AK.etag' upstream.json)
          ak_was=$(echo "$live" | jq -c '.nwi.units.AK.etag // null')
          if [ "$now" = "$was" ] && [ "${{ inputs.force }}" != "true" ] && [ "$PUBLISH" = "true" ]; then
            if [ "$ak_now" != "$ak_was" ]; then
              echo "::error::Alaska is not built from the zip FWS now lists (new zip, or not built for this release): run scripts/datasets/nwi_publish_ak.sh on a workstation"
              exit 1
            fi
            echo "nothing moved upstream"; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan the staging jobs
        id: plan
        if: steps.check.outputs.go == 'true'
        run: |
          uv run --project scripts python scripts/datasets/nwi.py plan --groups 6 \
            --upstream-out upstream.json > plan.json
          jq -c '.groups' plan.json
          echo "release=$(jq -r '.release' plan.json)" >> "$GITHUB_OUTPUT"
          echo "groups=$(jq -c '[.groups[] | join(" ")]' plan.json)" >> "$GITHUB_OUTPUT"

      - name: rclone
        if: steps.check.outputs.go == 'true'
        run: curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null

      # The same upstream for every job of the run. A new run keeps the units
      # an earlier run of the release staged (a staging job reuses one only
      # if it has the same zip and stage version) and clears the rest: what
      # choose, write and assemble rebuild, and the units no longer listed.
      # force clears everything.
      - name: Scratch prefix
        if: steps.check.outputs.go == 'true'
        run: |
          scratch="$REMOTE/_work/${{ steps.plan.outputs.release }}"
          if [ "${{ github.run_attempt }}" = "1" ]; then
            if [ "${{ inputs.force }}" = "true" ]; then
              rclone purge "$scratch" 2>/dev/null || true
            else
              rclone purge "$scratch/out" 2>/dev/null || true
              for f in win.parquet dedup.json; do
                rclone deletefile "$scratch/$f" 2>/dev/null || true
              done
              listed=$(jq -r '.groups[][]' plan.json | sort)
              # Every unit with anything left: counts, index, projects or rows.
              for u in $(rclone lsf --max-depth 1 "$scratch/stage" 2>/dev/null \
                         | sed -E 's#/$##; s#\.(json|index\.parquet|projects\.parquet)$##' | sort -u); do
                echo "$listed" | grep -qx "$u" && continue
                echo "dropping $u: no longer listed"
                rclone purge "$scratch/stage/$u" 2>/dev/null || true
                for f in "$u.json" "$u.index.parquet" "$u.projects.parquet"; do
                  rclone deletefile "$scratch/stage/$f" 2>/dev/null || true
                done
              done
            fi
          fi
          rclone copyto upstream.json "$scratch/upstream.json"

  stage:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        units: ${{ fromJSON(needs.plan.outputs.groups) }}
    env:
      SCRATCH: parquetry:parquetry/wetlands/_work/${{ needs.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --project scripts

      - name: Work dir, rclone, GDAL
        run: |
          sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work
          echo "WORK=/mnt/work" >> "$GITHUB_ENV"
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
          # GDAL reads the geodatabases (nwi.py, to_fgb() and gdb_layers()):
          # the image MassGIS uses, not apt's 3.8. It needs only /mnt/work.
          mkdir -p "$HOME/.local/bin"
          for tool in ogr2ogr ogrinfo; do
            cat > "$HOME/.local/bin/$tool" <<EOF
          #!/usr/bin/env bash
          exec docker run --rm -u "\$(id -u):\$(id -g)" -v /mnt/work:/mnt/work ghcr.io/osgeo/gdal:ubuntu-small-3.13.3 $tool "\$@"
          EOF
            chmod +x "$HOME/.local/bin/$tool"
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          df -h /mnt; free -g

      - name: Stage
        run: |
          rclone copyto "$SCRATCH/upstream.json" "$WORK/upstream.json"
          version=$(uv run --project scripts python -c \
                    "import sys; sys.path.insert(0, 'scripts'); from datasets.nwi import STAGE_VERSION as v; print(v)")
          todo=(); units=()
          for u in ${{ matrix.units }}; do
            # A re-run skips a unit an earlier attempt uploaded, if from the
            # zip this run's upstream lists (FWS can re-upload within a month).
            want=$(jq -r --arg u "$u" '.units[$u].etag' "$WORK/upstream.json")
            have=$(rclone cat "$SCRATCH/stage/$u.json" 2>/dev/null \
                   | jq -r '"\(.etag) \(.stage_version // 1)"' || true)
            if [ -n "$want" ] && [ "$want" != "null" ] && [ "$have" = "$want $version" ]; then
              echo "$u: already staged"
            else
              todo+=(--unit "$u"); units+=("$u")
            fi
          done
          [ ${#todo[@]} -eq 0 ] && exit 0
          export TMPDIR="$WORK/tmp"; mkdir -p "$TMPDIR"
          /usr/bin/time -v uv run --project scripts python scripts/datasets/nwi.py stage \
            --upstream "$WORK/upstream.json" --work-dir "$WORK/w" "${todo[@]}" \
            --low-disk --memory "$MEMORY" --threads 4 \
            2> >(grep -v -e organizePolygons -e "curve geometries" | tee "$WORK/time.txt" >&2)
          grep -E "Maximum resident|Elapsed" "$WORK/time.txt"
          # What an earlier attempt left of these units goes first (copy never
          # removes a file: a stale part would be read twice), then the rows,
          # indexes and projects, then each unit's counts, which mark it staged.
          for u in "${units[@]}"; do
            rclone purge "$SCRATCH/stage/$u" 2>/dev/null || true
            rclone deletefile "$SCRATCH/stage/$u.json" 2>/dev/null || true
            rclone deletefile "$SCRATCH/stage/$u.projects.parquet" 2>/dev/null || true
          done
          rclone copy "$WORK/w/stage" "$SCRATCH/stage" --filter "- *.json" --filter "- *.fgb" \
            --filter "- *.fixed.parquet" --filter "+ **" --transfers 16 --stats-one-line --stats 60s
          rclone copy "$WORK/w/stage" "$SCRATCH/stage" --max-depth 1 --filter "+ *.json" --filter "- *"

  choose:
    needs: [plan, stage]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      groups: ${{ steps.choose.outputs.groups }}
    env:
      SCRATCH: parquetry:parquetry/wetlands/_work/${{ needs.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --project scripts
      - name: Choose
        id: choose
        run: |
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
          sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work
          w=/mnt/work/w
          rclone copy "$SCRATCH/stage" "$w/stage" --max-depth 1 \
            --filter "+ *.index.parquet" --filter "- *"
          /usr/bin/time -v uv run --project scripts python scripts/datasets/nwi.py choose \
            --work-dir "$w" --memory "$MEMORY" --groups 6 > choose.json 2> >(tee time.txt >&2)
          grep -E "Maximum resident|Elapsed" time.txt
          cat choose.json; jq -c 'del(.targets)' "$w/dedup.json"
          echo "groups=$(jq -c '[.groups[] | join(" ")]' choose.json)" >> "$GITHUB_OUTPUT"
          rclone copy "$w" "$SCRATCH" --max-depth 1 --filter "+ win.parquet" \
            --filter "+ dedup.json" --filter "- *"

  write:
    needs: [plan, choose]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        targets: ${{ fromJSON(needs.choose.outputs.groups) }}
    env:
      SCRATCH: parquetry:parquetry/wetlands/_work/${{ needs.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --project scripts
      - name: Write
        run: |
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
          sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work
          w=/mnt/work/w; out=/mnt/work/out
          rclone copy "$SCRATCH" "$w" --max-depth 1 --filter "+ win.parquet" \
            --filter "+ upstream.json" --filter "- *"
          filters=(); args=()
          for t in ${{ matrix.targets }}; do
            filters+=(--filter "+ /*/target=$t/**"); args+=(--target "$t")
          done
          rclone copy "$SCRATCH/stage" "$w/stage" "${filters[@]}" --filter "- *" \
            --transfers 16 --stats-one-line --stats 60s
          export TMPDIR=/mnt/work/tmp; mkdir -p "$TMPDIR"
          /usr/bin/time -v uv run --project scripts python scripts/datasets/nwi.py write \
            --upstream "$w/upstream.json" --work-dir "$w" --out-dir "$out" "${args[@]}" \
            --low-disk --memory "$MEMORY" 2> >(tee time.txt >&2)
          grep -E "Maximum resident|Elapsed" time.txt
          # Uploaded with the headers they are served with: assemble copies
          # them server-side, which keeps them.
          rclone copy "$out" "$SCRATCH/out" --filter "+ *.parquet" --filter "- *" \
            --header-upload "$CACHE" --header-upload "Content-Type: application/vnd.apache.parquet" \
            --transfers 8 --stats-one-line --stats 60s
          rclone copy "$out/entries" "$SCRATCH/out/entries"

  assemble:
    needs: [plan, write]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      published: ${{ steps.published.outputs.done }}
    env:
      SCRATCH: parquetry:parquetry/wetlands/_work/${{ needs.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --project scripts
      - name: Assemble
        run: |
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
          sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work
          w=/mnt/work/w; out=/mnt/work/out
          rclone copy "$SCRATCH" "$w" --max-depth 1 --filter "+ upstream.json" \
            --filter "+ dedup.json" --filter "- *"
          rclone copy "$SCRATCH/stage" "$w/stage" --max-depth 1 --filter "+ *.json" \
            --filter "+ *.projects.parquet" --filter "- *"
          rclone copy "$SCRATCH/out/entries" "$out/entries"
          uv run --project scripts python scripts/datasets/nwi.py assemble \
            --upstream "$w/upstream.json" --work-dir "$w" --out-dir "$out" --memory "$MEMORY" \
            --live "$PUBLIC"
          jq -c '.parts' "$out/nwi/"*/_manifest.json
          echo "OUT=$out" >> "$GITHUB_ENV"

      # The data first (server-side, from the scratch prefix), then the files
      # that name it.
      - name: Publish
        if: env.PUBLISH == 'true'
        run: |
          rel=$(jq -r '.datasets[0].path' "$OUT/index.json")
          rclone copy "$SCRATCH/out/$rel" "$REMOTE/$rel" --filter "+ /state=*/wetlands.parquet" \
            --filter "- *" --transfers 16 --stats-one-line --stats 60s
          rclone copy "$OUT/$rel" "$REMOTE/$rel" --filter "+ codes.parquet" \
            --filter "+ projects.parquet" --filter "- *" \
            --header-upload "$CACHE" --header-upload "Content-Type: application/vnd.apache.parquet"
          rclone copy "$OUT/$rel" "$REMOTE/$rel" --filter "+ _manifest.json" \
            --filter "+ ATTRIBUTION.txt" --filter "- *" \
            --ignore-times --header-upload "Cache-Control: public, max-age=300"
          # A rebuild of the same release writes the same path: a state the
          # manifest no longer lists must not stay behind for the state=*
          # glob to read. The manifest keeps Alaska's entry (--live), so
          # Alaska's folder stays. Before _source.json, so that a failure
          # here leaves the next weekly run to rebuild and retry.
          keep=$(jq -r '.files[].state' "$OUT/$rel/_manifest.json" | sort)
          for d in $(rclone lsf --dirs-only "$REMOTE/$rel/" | grep '^state=' | sed 's|/$||'); do
            echo "$keep" | grep -qx "${d#state=}" && continue
            echo "removing stale $rel/$d"
            rclone purge "$REMOTE/$rel/$d"
          done
          rclone copy "$OUT" "$REMOTE" --max-depth 1 --filter "+ index.json" \
            --filter "+ _source.json" --filter "- *" \
            --ignore-times --header-upload "Cache-Control: public, max-age=300"

      - name: Check what is live
        if: env.PUBLISH == 'true'
        run: |
          set +e
          fail=0
          rel=$(jq -r '.datasets[0].path' "$OUT/index.json")
          for f in index.json _source.json $rel/_manifest.json $rel/ATTRIBUTION.txt \
                   $rel/codes.parquet $rel/projects.parquet \
                   $rel/state=MA/wetlands.parquet $rel/state=MN/wetlands.parquet \
                   $rel/state=PR/wetlands.parquet $rel/state=GU/wetlands.parquet; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -I "$PUBLIC/$f")
            [ "$code" = "200" ] || { echo "BAD $f -> $code"; fail=1; continue; }
            type=$(curl -sI "$PUBLIC/$f" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2}')
            echo "ok  $f ($type)"
          done
          exit $fail

      - name: Published
        id: published
        if: env.PUBLISH == 'true'
        run: echo "done=true" >> "$GITHUB_OUTPUT"

      - name: Remove the scratch prefix
        run: rclone purge "$SCRATCH"

  # Dispatched once Alaska (nwi_publish_ak.sh) and the map (nwi_tiles_local.sh)
  # are published: the catalog names both.
  catalog:
    if: inputs.stage == 'catalog'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --project scripts

      - name: rclone
        run: |
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
          rclone version | sed -n 1p

      # After the data, so the catalog never links a file that is not there.
      - name: STAC catalog, published
        run: |
          uv run --project scripts python scripts/datasets/nwi_catalog.py publish --remote "$REMOTE"
          for f in catalog/catalog.json catalog/nwi/collection.json \
                   catalog/projects/collection.json catalog/nwi/styles/default.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -I "$PUBLIC/$f")
            [ "$code" = "200" ] || { echo "BAD $f -> $code"; exit 1; }
            echo "ok  $f"
          done
