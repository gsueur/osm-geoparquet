# One-shot: delete the dated OSM snapshots and pinned catalogs, now that
# latest/ is the only version kept. Remove this workflow once it has run.
#
# Run it after one green nightly under the staging flow. Deleting cannot be
# undone. It refuses to run unless snapshots.json already has the new one-entry
# form and latest/ holds a full build, and it only ever touches osm/<YYYY-MM-DD>/
# and osm/catalog/<YYYY-MM-DD>/.
#
# Without the confirmation it only lists what it would delete.

name: purge-osm-snapshots

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DELETE THE SNAPSHOTS to delete. Empty: list only."
        required: false
        default: ""

# Shares the nightly's concurrency group: the purge and a build never touch the
# bucket at the same time.
concurrency:
  group: nightly
  cancel-in-progress: false

env:
  REMOTE: parquetry:parquetry/osm
  RCLONE_CONFIG_PARQUETRY_TYPE: s3
  RCLONE_CONFIG_PARQUETRY_PROVIDER: Cloudflare
  RCLONE_CONFIG_PARQUETRY_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  RCLONE_CONFIG_PARQUETRY_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  RCLONE_CONFIG_PARQUETRY_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  RCLONE_CONFIG_PARQUETRY_NO_CHECK_BUCKET: "true"

jobs:
  purge:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Tools
        run: bash .github/scripts/install-tools.sh

      - name: Purge
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          path=$(rclone cat "$REMOTE/snapshots.json" | jq -r '.snapshots | if length == 1 then .[0].path else "" end')
          [[ "$path" == "latest/" ]] || { echo "snapshots.json is not the one-entry form: refusing"; exit 1; }
          objects=$(rclone size --json "$REMOTE/latest/" | jq -r .count)
          (( objects >= 1600 )) || { echo "latest/ holds only $objects objects: refusing"; exit 1; }
          echo "latest/: $objects objects"

          dated() { rclone lsf --dirs-only "$1" | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}/$' || true; }
          data=$(dated "$REMOTE/")
          catalogs=$(dated "$REMOTE/catalog/")
          echo "dated snapshots:"; echo "$data"
          echo "pinned catalogs:"; echo "$catalogs"

          if [[ "$CONFIRM" != "DELETE THE SNAPSHOTS" ]]; then
            echo "listed only: nothing deleted"
            exit 0
          fi
          for d in $catalogs; do rclone purge "$REMOTE/catalog/$d"; done
          for d in $data; do rclone purge "$REMOTE/$d"; done
          echo "left under osm/:"; rclone lsf "$REMOTE/"
