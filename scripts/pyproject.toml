[project]
name = "osm-geoparquet"
version = "0.1.0"
description = "OSM -> GeoParquet 2.0 pipeline, partitioned by country and admin region"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Guillaume Sueur", email = "gsueur@geomermaids.com" },
]
dependencies = [
    "duckdb>=1.1.0",
    "geoarrow-pyarrow>=0.2",
    "geoparquet-io>=0.2.0",
    # Portolan validator for the catalog (scripts/catalog.py). Pinned exactly:
    # a newer rashid can add or retire rules, which should be a deliberate bump.
    "pyarrow>=22",
    "pycountry>=24",
    "rashid==0.1.8",
    "rich>=13.0",
]
